[[finding]]
id = "F05"
title = "Radix sort inside stable_sort for integers"
severity = "notable"
category = "design choice"
other = "llvm"
claims = ["matches", "ident_exact", "ident_core", "numbers"]
rationale = """stable_sort of integers under a standard comparison object switches to an LSD radix sort above \
a size threshold, a design only libc++ also has, and the helper and concept names match libc++'s. \
The threshold value, the byte-skipping logic and the code are different."""
[[finding.at]]
file = "include/ycxx/core/algo_sort.hpp"
anchor = "// ---- stable_sort of integers"
to = 100
[[finding.foreign]]
lib = "llvm"
file = "libcxx/include/__algorithm/stable_sort.h"
lines = [195, 260]

[[finding]]
id = "F06"
title = "Small-string layout"
severity = "notable"
category = "data layout"
other = "gnu"
also = ["msvc"]
claims = ["matches", "ident_exact", "ident_core"]
rationale = """basic_string's layout is the libstdc++ layout: the data pointer and the size first, then a union \
of the capacity and an inline buffer, with the long mode recognised by comparing the pointer with \
the buffer. The MSVC STL's inline capacity is the same size. The accessor for the long-mode test has \
libc++'s name, whose layout is different. A common, documented design."""
[[finding.at]]
file = "include/ycxx/core/basic_string.hpp"
anchor = "// Inline buffer: 16 bytes' worth"
from = -2
to = 15
[[finding.foreign]]
lib = "gnu"
file = "include/bits/basic_string.h"
lines = [210, 225]

[[finding]]
id = "F07"
title = "Red-black tree header"
severity = "notable"
category = "representation"
other = "llvm"
claims = ["matches", "ident_exact", "ident_core"]
rationale = """The tree's header node holds the root as its left child and the tree object caches the leftmost \
node, as libc++ does, with the same rationale given in the comment and the same accessor name. \
Unlike libc++, the header also tracks the rightmost node, as libstdc++ and the MSVC STL do. A \
hybrid of known designs."""
[[finding.at]]
