[[finding]]
id = "E02"
title = "pdqsort's published constants"
severity = "expected"
category = "published algorithm constants"
other = "llvm"
also = ["gnu", "msvc"]
claims = ["matches", "numbers", "ident_exact", "ident_core"]
rationale = """std::sort is pattern-defeating quicksort with branchless block partitioning. Its four tuning \
constants are those of the published pdqsort reference implementation (O. R. L. Peters, 2021), which \
libc++ also adopted. The insertion-sort cutoff of the other sorting paths is the classic value used \
across STL implementations since the HP STL."""
[[finding.at]]
file = "include/ycxx/core/algo_sort.hpp"
anchor = "O. R. L. Peters, \"Pattern-defeating Quicksort\""
from = -4
to = 400
[[finding.foreign]]
