name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    container: gcc:16          # official image: latest GCC 16 release
    steps:
      - uses: actions/checkout@v4

      - name: Toolchains (Clang 23, lld, ninja, cmake, uv; tools/toolchain/provision --detect-only)
        uses: ./.github/actions/setup-linux

      # The same stages as the macOS job. Any test reported FAIL (or XPASS) fails the job; an
      # expected failure is marked in the test (// XFAIL: <compiler> <reason>), never listed.
      - name: Policy, builds, freestanding, CMake package, own suite (tools/test)
        run: tools/test -j4 policy build freestanding cmake ycxx

      - name: Fetch conformance suites (run only; tools/fetch-suites)
        run: tools/fetch-suites

      # A quick sample of the external suites; full.yml runs them whole, nightly.
      - name: Conformance (both suites, both compilers; implemented areas)
        run: |
          # Every run happens; the step fails if any failed. Known compiler gaps are expected
          # failures (tests/<suite>/xfail.txt), never hidden.
          rc=0
          for c in gcc clang; do
            tools/run-conformance libcxx $c utilities/meta numerics/bit language.support/cmp || rc=1
            tools/run-conformance libstdcxx $c 20_util/pair 18_support/numeric_limits || rc=1
          done
          exit $rc

      - name: Test reports (every test with its commands, exit statuses and output)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/test-logs/*.html
            build/test-logs/*.md
            build/cmake-test/*.log
            build/test-logs/*.tsv
            build/test-logs/*.log
          if-no-files-found: ignore

  # macOS on Apple Silicon: Homebrew's GCC 16 and LLVM's Clang 23 release (provisioned and
  # cached). The same stages as the Linux job; any FAIL fails it, and its composite report
  # (artifact test-reports-macos) shows the failures in full.
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Toolchains (Homebrew GCC 16, ninja, cmake, uv; provisioned Clang 23, cached)
        uses: ./.github/actions/setup-macos

      - name: Policy, builds, freestanding, CMake package, own suite (tools/test)
        run: |
          . tools/toolchain/activate.sh
          tools/test -j3 policy build freestanding cmake ycxx

      # Which library each C++ ABI symbol of a test program binds to (libycxx's static runtime or
      # libSystem's libc++abi), and how the program behaves: diagnostics for the macOS port.
      - name: ABI symbol binding diagnostics
        if: always()
        run: |
          set +e +o pipefail  # a failing test program must not end the diagnostics
          . tools/toolchain/activate.sh
          mkdir -p build/diag
          for c in clang gcc; do
            echo "=== $c"
            tools/ycxx-cxx $c -Itests/ycxx/support tests/ycxx/exception/exception_ptr.pass.cpp -o build/diag/ep-$c -Wl,-map,build/diag/ep-$c.map || continue
            ( cd build/diag && ./ep-$c; echo "exit $?" )
            echo "--- imports (symbol <- dylib)"
            xcrun dyld_info -imports build/diag/ep-$c 2>&1 | grep -Ei 'cxa|personality|terminate|unexpected|Unwind|typeinfo|_ZTI|_ZTV|_ZNSt' | head -60
            echo "--- defined in the executable"
            nm -m build/diag/ep-$c | grep -Ei ' (___cxa|___gxx_personality|__ZSt9terminate|__ZSt17current_exception|__ZNSt15__exception_ptr)' | head -40
            echo "--- linked libraries"
            otool -L build/diag/ep-$c
            echo "--- link line (tools/ycxx-cxx, dry run)"
            tools/ycxx-cxx $c -### -Itests/ycxx/support tests/ycxx/exception/exception_ptr.pass.cpp -o /dev/null 2>&1 | tail -2
            echo "--- where the linker took __cxa_begin_catch, __cxa_throw, the personality routine from"
            grep -E '___cxa_begin_catch|___cxa_throw$|___gxx_personality_v0|___cxa_get_globals|__ZSt17current_exceptionv' build/diag/ep-$c.map | head -12
          done 2>&1 | tee build/diag/abi-binding.txt
          exit 0

      - name: Test reports (composite run report, suite reports)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-macos
          path: |
            build/test-logs/*.html
            build/test-logs/*.md
            build/test-logs/*.tsv
            build/test-logs/*.log
            build/cmake-test/*.log
            build/cmake-test/*/log.txt
            build/diag/*.txt
            build/diag/*.map
          if-no-files-found: ignore
