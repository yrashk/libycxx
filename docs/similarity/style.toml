# The style control (libycxx.org/similarity/style.html; docs/similarity/METHOD.md, "Style control").
# Committed text; the numbers are computed on every build. The conclusion below was written for the
# numbers at the time and is shown only while `conclusion_condition` holds; otherwise the page says
# the numbers have moved and the conclusion needs review.

lede = """libycxx's JPlag medians with libc++ and the MSVC STL are higher than the established libraries' medians \
with each other, while the identifier-preserving k-gram metric shows little elevation. This page tests \
whether that is shared modern idiom and surface style rather than shared content, with three controls \
applied to every pair alike."""

logic = """**Era-restricted areas.** Components every library wrote fresh for C++20 or later (ranges, mdspan, \
flat containers, format, expected, span, concepts and comparisons, bit, stop_token, generator), \
restricted to those files. If modern idiom drives the elevation, the established pairs rise toward \
libycxx's level there. Areas with shared lineage or forced content stay out: charconv (Ryu), the \
parallel algorithms (PSTL), text_encoding (IANA data).

**Style normalisation.** The comparison is repeated with what is style rather than content removed from \
every library alike: the specifiers constexpr, consteval, constinit, inline and explicit, noexcept and \
its condition, typename (and class in a template parameter list), and every qualification (namespace \
and class qualifiers, a leading ::, this->), on top of the usual removal of comments, configuration \
macros and attributes.

**Independent modern implementations.** The same components written in modern C++ outside the \
standard libraries: the Beman project's optional and inplace_vector, and the Kokkos mdspan reference \
implementation. Their similarity to the libraries is the "same idiom, different author" baseline. \
libc++'s mdspan derives from the Kokkos implementation, so that pair is derived, not independent."""

era_note = """Matrices over the C++20-era areas only, unnormalised. The C++03 fork has none of these components, so its pairs are empty."""

norm_note = """Matrices over all areas with style normalisation, applied identically to every library."""

control_note = """One table per component: every pair of the libraries that implement it, raw and style-normalised. \
libc++ with Kokkos is a derived pair."""

conclusion = """**Style explains the JPlag elevation; the independent implementations do not reproduce it.** \
With style normalised, libycxx's JPlag medians are at or below the largest median of the established \
pairs (0.67 to 0.92 times it): removing these tokens raises the established pairs much more than \
libycxx's (libstdc++ with libc++ from 0.065 to 0.143, libycxx with libc++ from 0.122 to 0.132), so \
the established libraries' differences from each other lie largely in this surface layer. Restricting \
to C++20-era areas removes the elevation against the MSVC STL but not against libc++ (about 1.6 times). \
Applying both controls at once leaves libycxx at 0.8 to 1.3 times the largest established pair, \
highest with libstdc++.

The Beman and Kokkos implementations score lower against every library than the libraries score against \
each other. Independent modern code by itself therefore does not reach libycxx's level. The libraries \
share standard-shaped structure that these implementations organise differently. Kokkos is a weak \
control: even libc++'s derived mdspan scores only moderately against it, because both have changed a \
great deal since. The identifier-preserving k-gram metric stays within the established pairs' range \
under every condition except era plus normalisation, where libycxx is slightly above it (up to 1.2 \
times on both k-gram metrics)."""

# The conclusion is shown while, for JPlag with style normalisation, libycxx's median with each
# library is at most this multiple of the largest established-pair median.
[conclusion_condition]
norm_jplag_ratio = 1.0
