name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    container: gcc:16          # official image: latest GCC 16 release
    steps:
      - uses: actions/checkout@v4

      - name: Install Clang 23, lld, ninja, cmake, uv (lit runs through uvx)
        run: |
          apt-get update -qq
          apt-get install -y -qq wget gnupg lsb-release ninja-build cmake python3-pip
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key > /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          echo "deb http://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs)-23 main" > /etc/apt/sources.list.d/llvm.list
          apt-get update -qq
          apt-get install -y -qq clang-23 lld-23
          pip3 install --break-system-packages uv
          ln -sf "$(command -v g++)" /usr/local/bin/g++-16
          ln -sf "$(command -v gcc)" /usr/local/bin/gcc-16
          mkdir -p /opt/gcc-16/lib64 /opt/gcc-16/lib/gcc/x86_64-pc-linux-gnu
          ln -sfn "$(dirname "$(g++ -print-libgcc-file-name)")" /opt/gcc-16/lib/gcc/x86_64-pc-linux-gnu/16.2.0

      - name: Toolchain detection (tools/toolchain/provision)
        run: tools/toolchain/provision --detect-only

      - name: Policy, builds, freestanding
        run: tools/check-all

      - name: CMake package (install, find_package, add_subdirectory)
        run: tests/cmake/run.sh

      - name: Fetch conformance suites (run only; tools/fetch-suites)
        run: |
          apt-get install -y -qq git xz-utils curl >/dev/null
          tools/fetch-suites

      - name: Conformance (both suites, both compilers; implemented areas)
        run: |
          for c in gcc clang; do
            tools/run-conformance libcxx $c utilities/meta numerics/bit language.support/cmp || true
            tools/run-conformance libstdcxx $c 20_util/pair 18_support/numeric_limits || true
          done

      - name: Test reports (every test with its commands, exit statuses and output)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/test-logs/*.html
            build/test-logs/*.md
            build/test-logs/*.tsv
            build/test-logs/*.log
          if-no-files-found: ignore

  # macOS on Apple Silicon: Homebrew's GCC 16 and LLVM's Clang 23 release (provisioned and
  # cached). The macOS port is in progress (STATUS.md): until it lands this job fails, and its
  # composite report (artifact test-reports-macos) shows where.
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install GCC, ninja, cmake, uv
        run: brew install gcc ninja cmake uv

      - name: Cache the provisioned Clang
        uses: actions/cache@v4
        with:
          path: ~/.local/share/ycxx/toolchains
          key: ycxx-toolchains-${{ runner.os }}-${{ runner.arch }}-llvm-23.1.2

      - name: Toolchains (tools/toolchain/provision)
        run: tools/toolchain/provision

      - name: Policy, builds, freestanding, CMake package, own suite (tools/test)
        run: |
          . tools/toolchain/activate.sh
          tools/test -j3 policy build freestanding cmake ycxx

      # Which library each C++ ABI symbol of a test program binds to (libycxx's static runtime or
      # libSystem's libc++abi), and how the program behaves: diagnostics for the macOS port.
      - name: ABI symbol binding diagnostics
        if: always()
        run: |
          . tools/toolchain/activate.sh
          mkdir -p build/diag
          for c in clang gcc; do
            echo "=== $c"
            tools/ycxx-cxx $c -Itests/ycxx/support tests/ycxx/exception/exception_ptr.pass.cpp -o build/diag/ep-$c -Wl,-map,build/diag/ep-$c.map || continue
            ( cd build/diag && ./ep-$c; echo "exit $?" )
            echo "--- imports (symbol <- dylib)"
            xcrun dyld_info -imports build/diag/ep-$c 2>&1 | grep -Ei 'cxa|personality|terminate|unexpected|Unwind|typeinfo|_ZTI|_ZTV|_ZNSt' | head -60
            echo "--- defined in the executable"
            nm -m build/diag/ep-$c | grep -Ei ' (___cxa|___gxx_personality|__ZSt9terminate|__ZSt17current_exception|__ZNSt15__exception_ptr)' | head -40
            echo "--- linked libraries"
            otool -L build/diag/ep-$c
          done 2>&1 | tee build/diag/abi-binding.txt

      - name: Test reports (composite run report, suite reports)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-macos
          path: |
            build/test-logs/*.html
            build/test-logs/*.md
            build/test-logs/*.tsv
            build/test-logs/*.log
            build/cmake-test/*.log
            build/cmake-test/*/log.txt
            build/diag/*.txt
            build/diag/*.map
          if-no-files-found: ignore
