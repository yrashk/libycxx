[[finding]]
id = "F08"
title = "Single internal names shared with libstdc++"
severity = "notable"
category = "internal helper names"
other = "gnu"
claims = ["ident_exact", "ident_core", "matches"]
rationale = """Several single internal names in different headers match libstdc++'s exactly: \
the shared_from_this hook (shared_ptr.hpp), the reallocating insertion (vector.hpp), the \
string-view alias (basic_string.hpp), the base of the atomic smart pointers (atomic_smart_ptr.hpp), \
the generator's copy awaiter (generator.hpp), the width and precision kind fields of the format \
specification (format_base.hpp), three concepts of the comparison customization points \
(compare_alg.hpp) and two concat_view helper predicates (ranges_join.hpp). Each is a short \
descriptive name; the code around them is structured differently (for example, the atomic smart \
pointers use a striped lock table and the concat predicates use pack indexing)."""
