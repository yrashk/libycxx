name: full

# The long runs, nightly and on demand (Actions > full > Run workflow): libc++'s and libstdc++'s
# whole suites on both compilers, on Linux and macOS, the own suite under ASan+UBSan and under
# ThreadSanitizer (each with libycxx instrumented too), and the own suite hardened, with
# -fno-exceptions, with -O2 and without transitive includes (-DYCXX_NO_TRANSITIVE_INCLUDES);
# the benchmarks against their baseline (bench/check); and the quickstart's commands on bare
# runners, with Clang downloaded (tests/quickstart/run.sh --provision).
# Any test reported FAIL (or XPASS) fails its job: there are no lists of known failures. A test
# that cannot pass for a reason outside the test and the library (a compiler bug) is an expected
# failure with its reason (the suite's xfail.txt, or // XFAIL in an own test); one that does not
# apply to libycxx is skipped with its category and reason (skip.txt). Every job uploads its
# reports.

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

jobs:
  linux-suites:
    runs-on: ubuntu-24.04
    container: gcc:16
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        suite: [libcxx, libstdcxx]
        compiler: [gcc, clang]
    env:
      YCXX_LONG_TESTS: '1'   # libc++'s long_tests feature
    steps:
      - uses: actions/checkout@v4
      - name: Toolchains, and the named locales the suites require
        uses: ./.github/actions/setup-linux
        with:
          locales: 'true'
      - name: ${{ matrix.suite }} suite, ${{ matrix.compiler }} (tools/test; fetches the suite)
        run: tools/test -j4 -q -c ${{ matrix.compiler }} build ${{ matrix.suite }}
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-linux-${{ matrix.suite }}-${{ matrix.compiler }}
          path: |
            build/test-logs/*.html
            build/test-logs/*.md
            build/test-logs/*.tsv
            build/test-logs/*.log

  # The own suite under ASan+UBSan, linked with a libycxx instrumented with the same sanitizers
  # (tools/run-conformance builds build/clang-asan-ubsan; DECISIONS §6.8).
  linux-asan-ubsan:
    runs-on: ubuntu-24.04
    container: gcc:16
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Toolchains
        uses: ./.github/actions/setup-linux
      - name: Own suite, clang, asan,ubsan (tools/test; libycxx instrumented too)
        run: tools/test -j4 -q -c clang -s asan,ubsan build ycxx
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-linux-ycxx-clang-asan-ubsan
          path: |
            build/test-logs/*.html
            build/test-logs/*.md
            build/test-logs/*.tsv
            build/test-logs/*.log

  # ThreadSanitizer: the own suite and libc++'s and libstdc++'s whole suites, with both compilers,
  # each linked with a libycxx instrumented with TSan too (build/<cc>-tsan; DECISIONS §6.8). On
  # the bare runner, with toolchains provisioned for it (.github/actions/setup-linux-tsan): TSan
  # needs vm.mmap_rnd_bits <= 28, which a container cannot set, and GCC's libtsan, which a GCC
  # configured without libsanitizer lacks; tools/toolchain/provision --with-sanitizers builds GCC
  # 16.2 with it. tsan-toolchain builds that GCC once and caches it (keyed on the version and the
  # provision script); the suite jobs restore it. A report is a race to fix, or a false positive
  # suppressed with its reason in tests/<suite>/tsan.supp; any FAIL fails the job.
  tsan-toolchain:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Toolchains for ThreadSanitizer (GCC 16.2 with libsanitizer, built and cached on a miss)
        uses: ./.github/actions/setup-linux-tsan
        with:
          save-gcc: 'true'
      - name: Both compilers link and run a ThreadSanitizer program
        run: |
          . tools/toolchain/activate.sh
          for cxx in "$YCXX_GXX" "$YCXX_CLANGXX"; do
            echo 'int main() {}' | "$cxx" -x c++ -fsanitize=thread - -o tsan-probe -Wl,-rpath,"$(dirname "$("$YCXX_GXX" -print-file-name=libtsan.so)")"
            ./tsan-probe && echo "$cxx: ThreadSanitizer links and runs"
          done

  linux-tsan:
    needs: tsan-toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        compiler: [clang, gcc]
        # libc++'s suite in two parts of about 4300 tests each, so that each stays well within a
        # job's time limit: the directories of std/ named in libcxx-1, and all the others.
        part:
          - { name: ycxx, stage: ycxx, dirs: '', others: false }
          - { name: libcxx-1, stage: libcxx, dirs: 'algorithms containers input.output iterators language.support library localization ranges', others: false }
          - { name: libcxx-2, stage: libcxx, dirs: 'algorithms containers input.output iterators language.support library localization ranges', others: true }
          - { name: libstdcxx, stage: libstdcxx, dirs: '', others: false }
    env:
      YCXX_LONG_TESTS: '1'   # libc++'s long_tests feature
    steps:
      - uses: actions/checkout@v4
      - name: Toolchains for ThreadSanitizer (GCC restored from the cache), and the suites' locales
        uses: ./.github/actions/setup-linux-tsan
        with:
          locales: ${{ matrix.part.stage != 'ycxx' }}
      - name: ${{ matrix.part.name }}, ${{ matrix.compiler }}, tsan (tools/test; libycxx instrumented too; fetches the suite)
        run: |
          set -- ${{ matrix.part.dirs }}
          if [ "${{ matrix.part.others }}" = true ]; then
            # Every directory of libc++'s std/ but those: a directory a newer suite adds runs too.
            tools/fetch-suites --libcxx-only
            . tools/lib/env.sh
            ycxx_suite_dirs
            named=" $* "
            set --
            for d in "$ycxx_libcxx_tests"/std/*/; do
              d=$(basename "$d")
              case $named in *" $d "*) ;; *) set -- "$@" "$d" ;; esac
            done
          fi
          filters=
          for d in "$@"; do filters="$filters -f $d"; done
          tools/test -j4 -q -c ${{ matrix.compiler }} -s tsan $filters build ${{ matrix.part.stage }}
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-linux-${{ matrix.part.name }}-${{ matrix.compiler }}-tsan
          path: |
            build/test-logs/*.html
            build/test-logs/*.md
            build/test-logs/*.tsv
            build/test-logs/*.log

  # The own suite in other library and compiler configurations. hardened: the library's
  # run-time precondition checks, and the death tests of tests/ycxx/precondition; noexcept:
  # -fno-exceptions (the tests that throw or catch are UNSUPPORTED: REQUIRES: exceptions); O2:
  # optimized; strict-includes: -DYCXX_NO_TRANSITIVE_INCLUDES, every header without its
  # transitive includes (DECISIONS §19). (The default run, in ci.yml, is unoptimized: no
  # separate -O0 job.)
  linux-configurations:
    runs-on: ubuntu-24.04
    container: gcc:16
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        config:
          - { name: hardened, args: --hardened }
          - { name: noexcept, args: --cxxflags=-fno-exceptions --config-name=noexcept }
          - { name: O2, args: --cxxflags=-O2 --config-name=O2 }
          - { name: strict-includes, args: --cxxflags=-DYCXX_NO_TRANSITIVE_INCLUDES --config-name=strict-includes }
    steps:
      - uses: actions/checkout@v4
      - name: Toolchains
        uses: ./.github/actions/setup-linux
      - name: Own suite, ${{ matrix.compiler }}, ${{ matrix.config.name }} (tools/test)
        run: tools/test -j4 -q -c ${{ matrix.compiler }} ${{ matrix.config.args }} build ycxx
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-linux-ycxx-${{ matrix.compiler }}-${{ matrix.config.name }}
          path: |
            build/test-logs/*.html
            build/test-logs/*.md
            build/test-logs/*.tsv
            build/test-logs/*.log

  # Real-world projects (tests/realworld) built against libycxx and tested with their own suites,
  # with the proof that every translation unit, object and image is libycxx's
  # (tools/realworld, the realworld stage of tools/test): any build, linkage or test failure fails
  # the job; a test that does not apply is skipped with its category and reason (skip.txt), and a
  # project's own non-standard code is patched with its reason (patches/).
  linux-realworld:
    runs-on: ubuntu-24.04
    container:
      image: gcc:16
      # core_pattern belongs to the host kernel. Allow this job to disable its piped
      # crash collector, which bypasses RLIMIT_CORE during expected test crashes.
      options: --privileged
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - name: Disable host core collector for death tests
        shell: bash
        run: |
          # Piped core handlers ignore ulimit -c 0. A regular file pattern makes the
          # zero core limit in tools/realworld effective for expected test crashes.
          printf 'core\n' > /proc/sys/kernel/core_pattern
          test "$(cat /proc/sys/kernel/core_pattern)" = core
      - uses: actions/checkout@v4
      - name: Toolchains
        uses: ./.github/actions/setup-linux
        with:
          locales: 'true'
      - name: Real-world projects, ${{ matrix.compiler }} (tools/test; fetches the projects)
        shell: bash
        run: |
          # These jobs have lost their runners during Abseil tests, before artifacts could
          # upload. Keep test progress and resource usage in the remote job log as they run.
          apt-get install -y -qq procps >/dev/null
          report_resources() {
            trap 'kill "${resource_sleep_pid:-}" 2>/dev/null || true; exit 0' TERM
            while :; do
              date -u '+Resource snapshot %Y-%m-%dT%H:%M:%SZ'
              awk '/^(MemAvailable|SwapFree):/ { print }' /proc/meminfo
              df -h .
              for counter in memory.current memory.peak memory.max memory.events; do
                if [ -r "/sys/fs/cgroup/$counter" ]; then
                  printf '%s: ' "$counter"
                  tr '\n' ' ' < "/sys/fs/cgroup/$counter"
                  printf '\n'
                fi
              done
              # Command names only: arguments and environments may contain credentials.
              ps -eo pid,ppid,comm,rss,pcpu --sort=-rss | head -n16 || true
              for log in build/test-logs/realworld-*/*/test.log; do
                if [ -f "$log" ]; then
                  printf 'Latest CTest output: %s\n' "$log"
                  tail -n4 "$log"
                fi
              done
              sleep 30 &
              resource_sleep_pid=$!
              wait "$resource_sleep_pid"
            done
          }
          report_resources &
          resource_monitor_pid=$!
          trap 'kill "$resource_monitor_pid" 2>/dev/null || true; wait "$resource_monitor_pid" 2>/dev/null || true' EXIT
          tools/test -v -j4 -c ${{ matrix.compiler }} build realworld
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-linux-realworld-${{ matrix.compiler }}
          path: |
            build/test-logs/*.html
            build/test-logs/*.md
            build/test-logs/*.tsv
            build/test-logs/realworld-*/**/*.log
            build/test-logs/realworld-*/**/*.txt

  # Performance regressions (bench/check, DECISIONS §15): every benchmark of bench/ built against
  # libycxx and libstdc++ with both compilers; the ratio libycxx/libstdc++ of each, the median of
  # 5 interleaved runs, is compared with the baseline revision measured on this same runner.
  # Ratios also depend on CPU architecture and scheduling (particularly atomic wait/notify);
  # the stored ratios from another machine cannot serve as the CI gate. A benchmark fails when it is
  # more than 30% (and 0.10) above its baseline ratio in the run and in 2 confirmation runs of the
  # suspects; it is then printed as FAIL and fails the job. An intended change updates the
  # baseline (bench/check --help). One compiler per job, so the two do not share the machine.
  linux-bench:
    runs-on: ubuntu-24.04
    container: gcc:16
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # bench/check measures the pinned baseline revision in a worktree
      - name: Toolchains
        uses: ./.github/actions/setup-linux
      - name: Performance gate regression tests
        run: python3 -m unittest discover -s bench -p 'test_*.py'
      - name: Benchmarks against the baseline, ${{ matrix.compiler }} (bench/check)
        run: bench/check --cc ${{ matrix.compiler }} --reference-baseline --md build/bench/check.md
      - name: Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-linux-bench-${{ matrix.compiler }}
          path: |
            build/bench/check*.json
            build/bench/check.md

  macos-suites:
    runs-on: macos-15
    timeout-minutes: 340
    env:
      YCXX_LONG_TESTS: '1'
    strategy:
      fail-fast: false
      matrix:
        suite: [libcxx, libstdcxx]
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Toolchains
        uses: ./.github/actions/setup-macos
      - name: ${{ matrix.suite }} suite, ${{ matrix.compiler }} (tools/test; fetches the suite)
        run: |
          . tools/toolchain/activate.sh
          tools/test -j3 -q -c ${{ matrix.compiler }} build ${{ matrix.suite }}
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-macos-${{ matrix.suite }}-${{ matrix.compiler }}
          path: |
            build/test-logs/*.html
            build/test-logs/*.md
            build/test-logs/*.tsv
            build/test-logs/*.log

  # The quickstart as a newcomer runs it (examples/quickstart/README.md, the website's first
  # sample): on a bare runner with only git, CMake, Ninja, curl and the system's C toolchain, the
  # documented commands run literally against this commit, with Clang 23 downloaded into an empty
  # toolchain cache by cmake/ycxx-toolchain.cmake (tests/quickstart/run.sh --provision).
  quickstart:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@v4
      - name: Ninja (the runner has git, CMake, curl and the C toolchain)
        run: |
          if [ "$(uname -s)" = Darwin ]; then brew install ninja; else sudo apt-get update && sudo apt-get install -y ninja-build; fi
          cmake --version | head -n 1
      - name: Quickstart commands, Clang 23 downloaded into an empty cache (tests/quickstart/run.sh --provision)
        run: tests/quickstart/run.sh --provision
      - name: Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-quickstart-${{ matrix.os }}
          path: build/quickstart-test/*/log.txt
          if-no-files-found: ignore
