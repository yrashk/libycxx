name: ci

on:
  push:
    branches: [main]
  pull_request:

# One run per PR (or branch): a new push cancels the PR's run still in progress. macOS runners are
# scarce and shared with the account's other repositories.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    container: gcc:16          # official image: latest GCC 16 release
    steps:
      - uses: actions/checkout@v4

      - name: Toolchains (Clang 23, lld, ninja, cmake, uv; tools/toolchain/provision --detect-only)
        uses: ./.github/actions/setup-linux

      # The same stages as the macOS job. Any test reported FAIL (or XPASS) fails the job; an
      # expected failure is marked in the test (// XFAIL: <compiler> <reason>), never listed.
      - name: Policy, builds, freestanding, CMake package, own suite (tools/test)
        run: tools/test -j4 policy build freestanding cmake ycxx

      # Reuse the out-of-tree programs built by the CMake stage above.
      - name: Verify static and shared portable builds use stock libstdc++
        run: |
          for compiler in gcc clang; do
            for shared in OFF ON; do
              consumer="build/cmake-test/$compiler/execution-portable-install-$shared/consumer"
              for program in portable_stop_token portable_execution portable_execution_module; do
                executable="$consumer/$program"
                dependencies=$(ldd "$executable")
                if ! printf '%s\n' "$dependencies" | grep -E '^[[:space:]]*libstdc\+\+\.so(\.[0-9]+)*[[:space:]]+=>[[:space:]]+/' >/dev/null; then
                  echo "$executable did not load stock libstdc++" >&2
                  exit 1
                fi
                if printf '%s\n' "$dependencies" | grep -E '^[[:space:]]*(libc\+\+(abi)?|libycxx)\.so(\.[0-9]+)*[[:space:]]' >/dev/null ||
                   nm --defined-only "$executable" | grep -E '[[:space:]]__ycxx_linkage_(static|shared)_v1$' >/dev/null; then
                  echo "$executable brings in a second C++ runtime" >&2
                  exit 1
                fi
                echo "$executable uses stock libstdc++"
              done
            done
          done

      # libycxx's shared library (DECISIONS §20): the own suite with every test linked against it
      # (build/<cc>-shared); the cmake stage above already built, installed and checked it.
      - name: Own suite against the shared library (tools/test --shared)
        run: tools/test -j4 --shared build ycxx

      # The quickstart's command for the shared library, as its README and the website show it.
      - name: Quickstart commands with the shared library (tests/quickstart/run.sh --shared)
        run: CMAKE_BUILD_PARALLEL_LEVEL=4 tests/quickstart/run.sh --shared

      - name: Fetch conformance suites (run only; tools/fetch-suites)
        run: tools/fetch-suites

      # A quick sample of the external suites; full.yml runs them whole, nightly.
      - name: Conformance (both suites, both compilers; implemented areas)
        run: |
          # Every run happens; the step fails if any failed. Known compiler gaps are expected
          # failures (tests/<suite>/xfail.txt), never hidden.
          rc=0
          for c in gcc clang; do
            tools/run-conformance libcxx $c utilities/meta numerics/bit language.support/cmp || rc=1
            tools/run-conformance libstdcxx $c 20_util/pair 18_support/numeric_limits || rc=1
          done
          exit $rc

      - name: Test reports (every test with its commands, exit statuses and output)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/test-logs/*.html
            build/test-logs/*.md
            build/cmake-test/*.log
            build/quickstart-test/*/log.txt
            build/test-logs/*.tsv
            build/test-logs/*.log
          if-no-files-found: ignore

  # Keep package builds on separate runners so their build trees do not add to the core suite's
  # disk use. The macos job below requires all of these checks.
  macos-core:
    name: macos core
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Toolchains (Homebrew GCC 16, Ninja, uv; pinned CMake and cached Clang 23)
        uses: ./.github/actions/setup-macos

      - name: Policy, builds, freestanding, own suite (tools/test)
        id: static-checks
        run: |
          . tools/toolchain/activate.sh
          cmake_path=$(command -v cmake)
          echo "CMake: $cmake_path"
          test "$cmake_path" = "$YCXX_CI_CMAKE_BIN/cmake"
          cmake --version
          tools/test -j3 policy build freestanding ycxx

      # The shared library (DECISIONS §20): the own suite linked against libycxx.0.1.dylib, and
      # the dylib's checks (exports, coexistence with Apple's libc++ and Homebrew's libstdc++,
      # host/plugin sharing, the mode guard; tools/check-shared-macos.sh).
      - name: Own suite against the shared library (tools/test --shared)
        if: always()
        env:
          STATIC_CHECKS_OUTCOME: ${{ steps.static-checks.outcome }}
        run: |
          . tools/toolchain/activate.sh
          if [ "$STATIC_CHECKS_OUTCOME" = success ]; then
            tools/test -j3 --shared-only build ycxx
          else
            tools/test -j3 --shared build ycxx
          fi
      - name: The shared library on macOS (tools/check-shared-macos.sh)
        if: always()
        run: |
          . tools/toolchain/activate.sh
          tools/check-shared-macos.sh

      # Which library each C++ ABI symbol of a test program binds to (libycxx's static runtime or
      # libSystem's libc++abi), and how the program behaves: diagnostics for the macOS port.
      - name: ABI symbol binding diagnostics
        if: always()
        run: |
          set +e +o pipefail  # a failing test program must not end the diagnostics
          . tools/toolchain/activate.sh
          mkdir -p build/diag
          for c in clang gcc; do
            echo "=== $c"
            tools/ycxx-cxx $c -Itests/ycxx/support tests/ycxx/exception/exception_ptr.pass.cpp -o build/diag/ep-$c -Wl,-map,build/diag/ep-$c.map || continue
            ( cd build/diag && ./ep-$c; echo "exit $?" )
            echo "--- imports (symbol <- dylib)"
            xcrun dyld_info -imports build/diag/ep-$c 2>&1 | grep -Ei 'cxa|personality|terminate|unexpected|Unwind|typeinfo|_ZTI|_ZTV|_ZNSt' | head -60
            echo "--- defined in the executable"
            nm -m build/diag/ep-$c | grep -Ei ' (___cxa|___gxx_personality|__ZSt9terminate|__ZSt17current_exception|__ZNSt15__exception_ptr)' | head -40
            echo "--- linked libraries"
            otool -L build/diag/ep-$c
            echo "--- link line (tools/ycxx-cxx, dry run)"
            tools/ycxx-cxx $c -### -Itests/ycxx/support tests/ycxx/exception/exception_ptr.pass.cpp -o /dev/null 2>&1 | tail -2
            echo "--- where the linker took __cxa_begin_catch, __cxa_throw, the personality routine from"
            grep -E '___cxa_begin_catch|___cxa_throw$|___gxx_personality_v0|___cxa_get_globals|__ZSt17current_exceptionv' build/diag/ep-$c.map | head -12
          done 2>&1 | tee build/diag/abi-binding.txt
          exit 0

      - name: Test reports (composite run report, suite reports)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-macos
          path: |
            build/test-logs/*.html
            build/test-logs/*.md
            build/test-logs/*.tsv
            build/test-logs/*.log
            build/diag/*.txt
            build/diag/*.map
          if-no-files-found: ignore

  macos-cmake:
    name: macos CMake (${{ matrix.compiler }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4

      - name: Toolchains for CMake (${{ matrix.compiler }})
        uses: ./.github/actions/setup-macos
        with:
          gcc-only: ${{ matrix.compiler == 'gcc' }}

      - name: Record GCC package setup
        if: matrix.compiler == 'gcc'
        continue-on-error: true
        run: |
          . tools/toolchain/activate.sh
          {
            /bin/sh -c '
              probe=outer
              probe_function() { :; }
              probe=inner probe_function
              printf "Shell function assignment after return %s (initial outer, temporary inner)\n" "$probe"
            '
            df -Pk "$GITHUB_WORKSPACE" "$RUNNER_TEMP" || :
            printf 'GCC path %s\n' "$YCXX_GXX"
            "$YCXX_GXX" --version
            printf 'CMake path %s\n' "$(command -v cmake)"
            cmake --version
          } >"$RUNNER_TEMP/libycxx-gcc-package-setup.txt"

      - name: Upload GCC package setup
        if: matrix.compiler == 'gcc'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-macos-cmake-gcc-setup
          path: ${{ runner.temp }}/libycxx-gcc-package-setup.txt

      - name: CMake package and quickstart (tools/test)
        env:
          COMPILER: ${{ matrix.compiler }}
        run: |
          . tools/toolchain/activate.sh
          cmake_path=$(command -v cmake)
          echo "CMake: $cmake_path"
          test "$cmake_path" = "$YCXX_CI_CMAKE_BIN/cmake"
          cmake --version
          tools/test -j3 -c "$COMPILER" cmake

      - name: Test reports (composite run report, package and quickstart logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-macos-cmake-${{ matrix.compiler }}
          path: |
            build/test-logs/*.html
            build/test-logs/*.md
            build/test-logs/*.tsv
            build/test-logs/*.log
            build/cmake-test/*.log
            build/cmake-test/*/log.txt
            build/quickstart-test/*/log.txt
          if-no-files-found: ignore

  macos:
    name: macos
    runs-on: ubuntu-24.04
    needs: [macos-core, macos-cmake]
    if: ${{ always() }}
    steps:
      - name: Require all macOS checks
        env:
          CORE_RESULT: ${{ needs.macos-core.result }}
          CMAKE_RESULT: ${{ needs.macos-cmake.result }}
        run: |
          printf 'macOS core result %s\nmacOS CMake matrix result %s\n' "$CORE_RESULT" "$CMAKE_RESULT"
          test "$CORE_RESULT" = success && test "$CMAKE_RESULT" = success
