name: setup-macos
description: >
  macOS on Apple Silicon with Homebrew's GCC 16, Ninja and uv, Kitware's pinned CMake, and LLVM's
  Clang 23 release (tools/toolchain/provision, cached).
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        brew install gcc ninja uv
        # CMake 4.5 scans the toolchain's std module, which needs headers libycxx disables (#33).
        cmake_dir=$(mktemp -d "$RUNNER_TEMP/ycxx-cmake.XXXXXX")
        cmake_archive=cmake-4.4.5-macos-universal
        curl -fsSL --retry 3 -o "$cmake_dir/$cmake_archive.tar.gz" \
          "https://github.com/Kitware/CMake/releases/download/v4.4.5/$cmake_archive.tar.gz"
        printf '%s  %s\n' 679e77a96b9ef9484cc6c1445255fc4f84206b48a65420efbedf16bdab55fbff \
          "$cmake_dir/$cmake_archive.tar.gz" | shasum -a 256 -c -
        tar -xzf "$cmake_dir/$cmake_archive.tar.gz" -C "$cmake_dir"
        cmake_bin="$cmake_dir/$cmake_archive/CMake.app/Contents/bin"
        echo "$cmake_bin" >> "$GITHUB_PATH"
        echo "YCXX_CI_CMAKE_BIN=$cmake_bin" >> "$GITHUB_ENV"
    - uses: actions/cache@v4
      with:
        path: ~/.local/share/ycxx/toolchains
        key: ycxx-toolchains-${{ runner.os }}-${{ runner.arch }}-llvm-23.1.5
    - shell: bash
      run: tools/toolchain/provision
