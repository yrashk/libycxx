[[finding]]
id = "F01"
title = "Floating-point midpoint"
severity = "notable"
category = "local variable names and numeric thresholds"
other = "gnu"
also = ["llvm"]
claims = ["matches", "ident_exact", "ident_core", "numbers"]
rationale = """The floating-point branch of `std::midpoint` has the same four-way case analysis, the same two \
threshold expressions and the same local-variable names as libstdc++'s. libc++ has the same algorithm \
and thresholds with different names. About twelve lines. The proposal that introduced midpoint \
(P0811R3) shows a different formula, so this form is not from the paper; it is, however, already \
shared by two established implementations."""
[[finding.at]]
file = "include/ycxx/core/numeric.hpp"
anchor = "// [numeric.ops.midpoint]"
to = 27
[[finding.foreign]]
lib = "gnu"
file = "include/std/numeric"
lines = [243, 256]
[[finding.foreign]]
lib = "llvm"
file = "libcxx/include/__numeric/midpoint.h"
lines = [60, 75]

[[finding]]
id = "F02"
title = "Sorting helper names from the HP/SGI STL"
severity = "notable"
category = "internal helper names"
other = "gnu"
claims = ["ident_exact", "ident_core"]
rationale = """Four sorting helpers in algo_sort.hpp (the unguarded insertion sort, the buffered stable \
partition, the buffered merge and the buffered stable sort) carry the same names as libstdc++'s \
corresponding helpers, and the buffered merge uses the same two local names for the cut lengths. \
The algorithms are written differently: the merge recurses on the smaller side, stable_sort is a \
top-down merge sort with its own cutoff, and sort is pdqsort. The names come from the 1994 HP/SGI \
STL and are reproduced in many books, so this is a naming echo rather than copied code."""
[[finding.at]]
file = "include/ycxx/core/algo_sort.hpp"
anchor_sha = "764df43069b42ed1"
to = 12
[[finding.at]]
file = "include/ycxx/core/algo_sort.hpp"
anchor_sha = "24c496c808d4b426"
to = 52
[[finding.at]]
file = "include/ycxx/core/algo_sort.hpp"
anchor_sha = "1c1b0dbcf7641b39"
to = 76
[[finding.foreign]]
lib = "gnu"
file = "include/bits/stl_algo.h"
lines = [2361, 2400]

[[finding]]
id = "F03"
title = "tuple stored as one base per element"
severity = "notable"
category = "implementation strategy and helper name"
other = "llvm"
claims = ["matches", "ident_exact", "ident_core"]
rationale = """tuple stores each element in its own base class, indexed by an index sequence and combined by \
multiple inheritance. libc++ uses this strategy, and the per-element base has the same name as \
libc++'s; libstdc++ and the MSVC STL use recursive inheritance instead. The strategy is widely \
published. libycxx holds the element as a `[[no_unique_address]]` member rather than through \
empty-base inheritance, and its allocator-construction plumbing differs."""
[[finding.at]]
file = "include/ycxx/core/tuple.hpp"
anchor = "// Layout: one base subobject per element"
from = -3
to = 76
[[finding.foreign]]
lib = "llvm"
file = "libcxx/include/tuple"
lines = [270, 330]

[[finding]]
id = "F04"
title = "shared_ptr control-block operation names"
severity = "notable"
category = "internal helper names"
other = "llvm"
claims = ["matches", "ident_exact", "ident_core"]
rationale = """The control block's four reference-count operations have the same names as libc++'s. The \
counting convention, the atomic operations, the class layout and the disposal hook differ; the \
disposal hook and the control block's class name follow a third library's naming style."""
