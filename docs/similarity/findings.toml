# Curated findings of the similarity analysis (docs/similarity/METHOD.md).
#
# Each [[finding]] locates its libycxx range(s) by an anchor, not a line number: `anchor` is a text
# the libycxx line contains, `anchor_sha` the hash of the whole line (tools/similarity/lib/judge.py
# line_sha; used where the line's text should not be repeated here), `from`/`to` are line offsets
# from the anchor. No `anchor` means the whole file. `other` is the library it matches ("all" for
# all three), `also` further libraries that show the same; `claims` the kinds of computed result it
# accounts for (matches, ident_exact, ident_core, numbers, tables, strings, comment_lines, typos).
# [[finding.foreign]] gives the other library's file and lines at the pinned version, for the
# excerpt shown on the site.
#
# Rationale is written in libycxx's terms only: nothing quoted from the other implementations (no
# identifiers, literals, constants or comments); their file paths are fine. The policy leak check
# (tools/similarity/leakcheck) enforces it.

lede = """Each finding is a judgment made in advance and committed in docs/similarity/findings.toml, with \
its rationale; the excerpts below are generated at build time from the pinned sources. Results that \
no finding, reviewed group or automatic rule covers are listed under Unreviewed."""

severity_criteria = """**none**: no similarity beyond chance. **expected**: forced by the standard, an ABI, a platform \
or a registry, or by a published algorithm or reference implementation. **notable**: an arbitrary \
choice matching one library in a short or isolated place, where coincidence or diffuse influence is \
plausible. **significant**: an extended arbitrary match (structure together with internal names, \
comments or constants over tens of lines), suggesting derivation."""

[rules]
standard-shaped = "The match shares no internal (reserved, non-standard) name with the other library, and at least 70% of libycxx's identifiers in it are the standard's own vocabulary: code whose shape the standard specifies (synopses, \"Equivalent to\" bodies, exposition-only classes)."
shape-only = "The match shares no internal name and the spelling differs (lexical ratio below 0.5): only the token structure is alike."

